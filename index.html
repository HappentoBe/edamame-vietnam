<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }

body {
  background: #fff;
  width: 100vw; height: 100dvh;
  overflow: hidden;
  font-family: 'Segoe UI', 'Arial Unicode MS', sans-serif;
  user-select: none;
  writing-mode: horizontal-tb;
  -webkit-writing-mode: horizontal-tb;
}

#game {
  width:100%; height:100%;
  position: relative;
  writing-mode: horizontal-tb;
  -webkit-writing-mode: horizontal-tb;
}

/* 鞘を画面下部に固定する外枠 */
#pod-anchor {
  position: fixed;
  bottom: 7.5vh;
  left: 50%;
  transform: translateX(-50%);
  z-index: 55;
}

#pod-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  writing-mode: horizontal-tb;
  -webkit-writing-mode: horizontal-tb;
}

/* 豆の行（鞘の上に並ぶ） */
#beans-row {
  display: flex;
  flex-direction: row;
  align-items: flex-end;
  justify-content: center;
  gap: clamp(8px, 3.2vw, 12px);
  position: relative;
  z-index: 5;
  margin-bottom: clamp(6px, 2.1vw, 8px);
  writing-mode: horizontal-tb;
  -webkit-writing-mode: horizontal-tb;
}

.bean-char {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  flex-shrink: 0;
  cursor: pointer;
  writing-mode: horizontal-tb;
  -webkit-writing-mode: horizontal-tb;
}
.bean-char canvas {
  border-radius: 50%;
  display: block;
  box-shadow: 0 3px 10px rgba(60,120,20,0.30);
}

/* 吹き出し */
.speech-bubble {
  position: absolute;
  bottom: calc(100% + clamp(8px, 2.7vw, 10px));
  left: 50%;
  transform: translateX(-50%) scale(0);
  background: #ffffff;
  border: 3px solid #7db833;
  border-radius: 18px;
  padding: clamp(8px, 3vw, 11px) clamp(11px, 4.5vw, 17px);
  font-size: clamp(13.07px, 5.08vw, 18.88px);
  font-weight: bold;
  color: #4a7a10;
  writing-mode: horizontal-tb !important;
  -webkit-writing-mode: horizontal-tb !important;
  text-orientation: mixed !important;
  white-space: normal;
  width: clamp(187px, 51.5vw, 312px);
  max-width: clamp(187px, 51.5vw, 312px);
  text-align: center;
  line-height: 1.6;
  transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events: none;
  z-index: 60;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}
.speech-bubble::after {
  content:''; position:absolute; top:100%; left:50%;
  transform:translateX(-50%);
  border:7px solid transparent; border-top-color:#7db833;
}
.speech-bubble::before {
  content:''; position:absolute; top:calc(100% - 3px); left:50%;
  transform:translateX(-50%);
  border:7px solid transparent; border-top-color:#fff;
  z-index:1;
}
.speech-bubble.show {
  transform:translateX(-50%) scale(1);
}
/* 左豆：吹き出しを右へ */
.speech-bubble.to-right {
  left: 0;
  transform: translateX(0) scale(0);
}
.speech-bubble.to-right.show {
  transform: translateX(0) scale(1);
}
.speech-bubble.to-right::after { left: 15%; }
.speech-bubble.to-right::before { left: 15%; }
/* 右豆：吹き出しを左へ */
.speech-bubble.to-left {
  left: auto;
  right: 0;
  transform: translateX(0) scale(0);
}
.speech-bubble.to-left.show {
  transform: translateX(0) scale(1);
}
.speech-bubble.to-left::after { left: 85%; }
.speech-bubble.to-left::before { left: 85%; }

/* 鞘 */
#pod-wrap {
  position: relative;
  z-index: 10;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.1s;
}
#pod-wrap:active { transform: scale(0.96); }

#pod-img {
  display: block;
  height: auto;
  filter: drop-shadow(0 6px 20px rgba(80,140,30,0.22));
  pointer-events: none;
  -webkit-user-drag: none;
}

/* 長押しリング */
#press-ring {
  position: absolute;
  top: 50%; left: 50%;
  width: 56px; height: 56px;
  margin: -28px 0 0 -28px;
  border-radius: 50%;
  border: 3px solid transparent;
  border-top-color: #5c9c2e;
  opacity: 0;
  transform: rotate(-90deg);
  pointer-events: none;
}
#press-ring.running {
  opacity: 1;
  animation: ring-fill 0.6s linear forwards;
}
@keyframes ring-fill {
  0%   { border-color:transparent; border-top-color:#5c9c2e;    transform:rotate(-90deg); }
  25%  { border-right-color:#5c9c2e;  transform:rotate(0deg);   }
  50%  { border-bottom-color:#5c9c2e; transform:rotate(90deg);  }
  75%  { border-left-color:#5c9c2e;   transform:rotate(180deg); }
  100% { border-color:#5c9c2e;        transform:rotate(270deg); }
}

/* スワイプヒント */
#swipe-hint {
  margin-top: clamp(12px, 4.3vw, 16px);
  font-size: clamp(13px, 4vw, 15px); font-weight: bold;
  color: #5c9c2e;
  text-align: center;
  opacity: 0; transition: opacity 0.4s;
  pointer-events: none;
}
#swipe-hint.show { opacity:1; animation: sway 1.8s ease-in-out infinite; }
@keyframes sway {
  0%,100% { transform:translateX(0); }
  30%     { transform:translateX(-10px); }
  70%     { transform:translateX(10px); }
}

/* 豆が飛ぶ */
@keyframes fly-out {
  0%   { transform:translate(0,0) rotate(0deg) scale(1); opacity:1; }
  100% { transform:translate(var(--fx),var(--fy)) rotate(var(--fr)) scale(0.2); opacity:0; }
}

/* 鞘シェイク */
@keyframes pod-shake {
  0%,100% { transform:rotate(0deg); }
  20%     { transform:rotate(-5deg); }
  40%     { transform:rotate(5deg);  }
  60%     { transform:rotate(-3deg); }
  80%     { transform:rotate(3deg);  }
}
.pod-shake { animation: pod-shake 0.4s ease; }

/* 鞘スライド */
@keyframes out-left  { to { transform:translateX(-130vw) rotate(-20deg); opacity:0; } }
@keyframes out-right { to { transform:translateX( 130vw) rotate( 20deg); opacity:0; } }
@keyframes in-right  { from { transform:translateX( 130vw); opacity:0; } to { transform:none; opacity:1; } }
@keyframes in-left   { from { transform:translateX(-130vw); opacity:0; } to { transform:none; opacity:1; } }

#pod-area.out-left  { animation: out-left  0.5s  ease-in                      forwards; }
#pod-area.out-right { animation: out-right 0.5s  ease-in                      forwards; }
#pod-area.in-right  { animation: in-right  0.52s cubic-bezier(0.22,1,0.36,1) forwards; }
#pod-area.in-left   { animation: in-left   0.52s cubic-bezier(0.22,1,0.36,1) forwards; }

/* カウンター */
#counter {
  position: fixed; top:clamp(16px, 5.3vw, 20px); right:clamp(16px, 5.3vw, 20px);
  font-size: clamp(33px, 10.5vw, 39px); color: #999;
  text-align: right; line-height: 1.6;
}
.counter-img {
  height: clamp(33px, 10.5vw, 39px);
  width: auto;
  vertical-align: middle;
}
.counter-img-mame {
  background: #fff;
}

/* クリア */
#cleared {
  position: fixed; inset: 0;
  background: rgba(255,255,255,0.96);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 100;
  opacity: 0; pointer-events: none;
  transition: opacity 0.6s;
}
#cleared.show { opacity:1; pointer-events:all; }
.cl-icon  { margin-bottom:10px; }
.cl-icon img { width: 160px; height: 160px; object-fit: cover; border-radius: 50%; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
.cl-title { font-size:30px; font-weight:bold; color:#5c9c2e; margin-bottom:8px; }
.cl-sub   { font-size:15px; color:#aaa; margin-bottom:40px; }
#retry-btn {
  background:#5c9c2e; color:#fff;
  border:none; border-radius:50px;
  padding:14px 44px; font-size:20px; font-weight:bold;
  font-family:inherit; cursor:pointer;
  box-shadow: 0 4px 16px rgba(92,156,46,0.35);
}
#retry-btn:active { transform:scale(0.94); }

/* 言語切替ボタン */
#lang-switch {
  position: fixed;
  top: clamp(16px, 5.3vw, 20px);
  left: clamp(16px, 5.3vw, 20px);
  display: flex;
  align-items: center;
  gap: 6px;
  z-index: 10;
}
.lang-btn {
  background: #ffffff;
  border: 2px solid #ddd;
  border-radius: 14px;
  padding: 4px 10px;
  cursor: pointer;
  opacity: 0.4;
  transition: opacity 0.2s, border-color 0.2s;
  font-family: inherit;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.lang-btn .flag {
  font-size: clamp(24px, 7.5vw, 33px);
  line-height: 1;
}
.lang-btn .label {
  font-size: clamp(13.5px, 3.75vw, 16.5px);
  color: #666;
  line-height: 1;
}
.lang-btn.active {
  opacity: 1;
  border-color: #5c9c2e;
}
</style>
</head>

<script>
// ================================================================
// 顔画像
// ================================================================
const FACE_FILES = [
  'face/IMG_7819.PNG?v=202603111430',
  'face/IMG_7820.PNG?v=202603111430',
  'face/IMG_7822.PNG?v=202603111430',
  'face/IMG_7823.PNG?v=202603111430',
  'face/IMG_7824.PNG?v=202603111430',
  'face/IMG_7825.PNG?v=202603111430',
  'face/IMG_7826.PNG?v=202603111430',
  'face/IMG_7827.PNG?v=202603111430',
  'face/IMG_7828.PNG?v=202603111430',
  'face/IMG_7829.PNG?v=202603111430',
];

const faceImages = new Array(FACE_FILES.length).fill(null);

FACE_FILES.forEach((src, i) => {
  const img = new Image();
  img.onload = () => {
    faceImages[i] = img;
    refreshAllBeanFaces();
  };
  img.src = src;
});

function drawFaceOnCanvas(canvas, fi) {
  const SZ  = canvas.width;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, SZ, SZ);

  const img = faceImages[fi];
  if (img) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(SZ/2, SZ/2, SZ/2 - 1, 0, Math.PI * 2);
    ctx.clip();
    const W = img.naturalWidth, H = img.naturalHeight;
    const s  = Math.min(W, H);
    const sx = (W - s) / 2, sy = (H - s) / 2;
    ctx.drawImage(img, sx, sy, s, s, 0, 0, SZ, SZ);
    ctx.restore();
  } else {
    const g = ctx.createRadialGradient(SZ*.38,SZ*.33,SZ*.08, SZ/2,SZ/2,SZ/2);
    g.addColorStop(0,'#c8e86a'); g.addColorStop(1,'#5a9018');
    ctx.beginPath(); ctx.arc(SZ/2,SZ/2,SZ/2-1,0,Math.PI*2);
    ctx.fillStyle = g; ctx.fill();
  }
}

function refreshAllBeanFaces() {
  document.querySelectorAll('.bean-char canvas').forEach(c => {
    const fi = parseInt(c.dataset.fi, 10);
    if (!isNaN(fi)) drawFaceOnCanvas(c, fi);
  });
}

// ================================================================
// Web Audio API — 効果音
// ================================================================
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function sfxMunyu() {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sine';
  o.frequency.setValueAtTime(130, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(58, audioCtx.currentTime + 0.20);
  g.gain.setValueAtTime(0.38, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.24);
  o.start(); o.stop(audioCtx.currentTime + 0.24);
}

function sfxPunyu() {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sine';
  o.frequency.setValueAtTime(300, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(540, audioCtx.currentTime + 0.07);
  o.frequency.exponentialRampToValueAtTime(240, audioCtx.currentTime + 0.22);
  g.gain.setValueAtTime(0.28, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.26);
  o.start(); o.stop(audioCtx.currentTime + 0.26);
}

function sfxPyun() {
  if (!audioCtx) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(180, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(960, audioCtx.currentTime + 0.30);
  g.gain.setValueAtTime(0.18, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.34);
  o.start(); o.stop(audioCtx.currentTime + 0.34);
}

function sfxShu() {
  if (!audioCtx) return;
  const sr  = audioCtx.sampleRate;
  const len = Math.floor(sr * 0.14);
  const buf = audioCtx.createBuffer(1, len, sr);
  const d   = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * (1 - i/len);
  const src = audioCtx.createBufferSource();
  const flt = audioCtx.createBiquadFilter();
  const g   = audioCtx.createGain();
  src.buffer = buf; flt.type = 'highpass'; flt.frequency.value = 2500;
  src.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
  g.gain.setValueAtTime(0.34, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.14);
  src.start();
}

function sfxFanfare() {
  if (!audioCtx) return;
  [
    [523,0.00],[659,0.12],[784,0.24],
    [1047,0.36],[1319,0.50],[1047,0.64],[1319,0.74],[1047,0.82]
  ].forEach(([f, t]) => {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'triangle'; o.frequency.value = f;
    const s = audioCtx.currentTime + t;
    g.gain.setValueAtTime(0, s);
    g.gain.linearRampToValueAtTime(0.26, s + 0.04);
    g.gain.exponentialRampToValueAtTime(0.01, s + 0.40);
    o.start(s); o.stop(s + 0.42);
  });
}

// ================================================================
// Web Speech API — 日本語読み上げ
// ================================================================
let jaVoice = null;
// ジェスチャーハンドラ内で事前選択したセリフを保持する
let pendingSpeech = null;

function loadVoices() {
  const voices = speechSynthesis.getVoices();
  if (voices.length === 0) return;
  jaVoice = voices.find(v => v.name === 'Google 日本語' && v.lang === 'ja-JP')
         || voices.find(v => v.lang === 'ja-JP')
         || null;
}

// 音声リストは非同期で読み込まれるため両方で取得を試みる
if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

function speakJapanese(text) {
  if (!window.speechSynthesis) return;
  const clean = text.replace(/\n/g, '\u3000');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'ja-JP';
  u.rate = 0.85;
  if (jaVoice) u.voice = jaVoice;
  speechSynthesis.speak(u);
}

// ================================================================
// セリフ表示ユーティリティ
// ================================================================
function formatSpeech(text) {
  return text.replace(/\n/g, '<br>');
}

// ================================================================
// セリフデータ（vi: ベトナム語, ja: 日本語）
// ================================================================
const SPEECHES = [
  // === 1. Chào hỏi & lễ nghi (挨拶・礼儀) ===
  { vi: "Chào buổi sáng!\nHôm nay cũng cố gắng nào!", ja: "おはようございます！\n今日も一日頑張りましょう！" },
  { vi: "Cảm ơn rất nhiều!\nSự giúp đỡ của bạn rất quý giá!", ja: "本当にありがとうございます！\nあなたの助けはとても貴重です！" },
  { vi: "Xin lỗi vì đã làm phiền!\nTôi sẽ chú ý hơn lần sau!", ja: "お邪魔してすみません！\n次回からもっと注意します！" },

  { vi: "Tôi đến rồi ạ!\nXin chào tất cả mọi người!", ja: "出勤しました！\n皆さん、こんにちは！" },
  { vi: "Tôi về trước nhé!\nHẹn gặp lại ngày mai!", ja: "お先に失礼します！\nまた明日会いましょう！" },
  { vi: "Rất vui được làm việc cùng!\nCùng nhau cố gắng nhé!", ja: "ご一緒できて嬉しいです！\n一緒に頑張りましょう！" },
  { vi: "Cảm ơn đã giúp đỡ!\nTôi rất biết ơn bạn!", ja: "助けてくれてありがとう！\nとても感謝しています！" },
  { vi: "Cho phép tôi hỏi một chút!\nTôi có điều chưa rõ ạ!", ja: "ちょっと伺ってもよろしいですか？\n分からないことがあります！" },
  { vi: "Xin lỗi, làm ơn cho tôi qua!\nCảm ơn bạn rất nhiều!", ja: "すみません、通してください！\nありがとうございます！" },

  { vi: "Chúc một ngày làm việc tốt!\nCùng nhau làm việc tích cực!", ja: "良い仕事ができますように！\n一緒に前向きに働きましょう！" },
  { vi: "Cảm ơn vì đã chỉ bảo!\nTôi sẽ ghi nhớ và thực hiện!", ja: "教えてくれてありがとう！\n覚えて実行するようにします！" },
  { vi: "Tôi xin phép nghỉ trước!\nCảm ơn mọi người hôm nay!", ja: "お先に失礼します！\n今日はありがとうございました！" },

  { vi: "Cảm ơn sự quan tâm của bạn!\nTôi rất trân trọng!", ja: "お気遣いありがとうございます！\n感謝しています！" },
  { vi: "Chào tạm biệt! Hẹn gặp lại!\nChúc buổi chiều vui vẻ!", ja: "さようなら！また会いましょう！\n楽しい午後を過ごしてください！" },
  { vi: "Hôm nay nhờ mọi người giúp đỡ!\nTôi sẽ cố gắng hết sức!", ja: "今日は皆さんよろしくお願いします！\n精一杯頑張ります！" },
  { vi: "Rất vui được làm quen!\nMong được hợp tác cùng!", ja: "お知り合いになれて嬉しいです！\nご協力をお願いします！" },
  { vi: "Tôi hiểu, cảm ơn!\nTôi sẽ chú ý thực hiện đúng!", ja: "分かりました、ありがとう！\n正しく行えるよう注意します！" },
  { vi: "Xin lỗi vì đã làm bạn chờ!\nTôi sẽ nhanh hơn lần sau!", ja: "お待たせしてすみません！\n次回はもっと早くします！" },
  { vi: "Chào buổi chiều!\nCòn một nửa ngày nữa, cố lên!", ja: "こんにちは（午後）！\nあと半日、頑張りましょう！" },
  { vi: "Cảm ơn vì hôm nay!\nNhờ mọi người tôi hoàn thành được!", ja: "今日はありがとうございました！\n皆さんのおかげで完了できました！" },
  { vi: "Tôi sẽ cố gắng hết sức!\nXin hãy chỉ bảo thêm cho tôi!", ja: "全力で頑張ります！\nもっといろいろ教えてください！" },
  { vi: "Cảm ơn đã tin tưởng tôi!\nTôi sẽ không phụ lòng mọi người!", ja: "信頼してくれてありがとう！\n皆さんの期待を裏切らないようにします！" },
  { vi: "Xin hãy chỉ bảo thêm!\nTôi còn nhiều điều cần học!", ja: "もっと教えてください！\nまだまだ学ぶべきことがたくさんあります！" },
  { vi: "Cảm ơn vì đã kiên nhẫn!\nTôi sẽ cải thiện từng ngày!", ja: "根気強く付き合ってくれてありがとう！\n日々改善していきます！" },
  { vi: "Được rồi, tôi sẽ làm!\nXin cứ để tôi lo!", ja: "分かりました、やります！\n私に任せてください！" },
  { vi: "Xin cảm ơn mọi người!\nNhờ có mọi người tôi mới làm được!", ja: "皆さんありがとうございます！\n皆さんのおかげでできました！" },
  { vi: "Chào, bạn có khỏe không?\nHôm nay trông bạn vui vẻ đấy!", ja: "やあ、元気？\n今日は楽しそうだね！" },
  { vi: "Tôi sẽ báo cáo ngay ạ!\nXin hãy đợi một chút!", ja: "すぐに報告します！\n少々お待ちください！" },
  { vi: "Xin phép được nhờ bạn!\nBạn có thể giúp tôi được không?", ja: "お願いしてもよろしいですか？\n手伝ってもらえますか？" },
  { vi: "Hôm nay cũng vui vẻ làm việc!\nCùng nhau tạo ra ngày tốt đẹp!", ja: "今日も楽しく働きましょう！\n一緒に良い一日にしましょう！" },
  { vi: "Cảm ơn vì đã hỗ trợ!\nNhờ bạn mọi việc suôn sẻ hơn!", ja: "サポートありがとう！\nあなたのおかげで物事がスムーズに進みました！" },
  { vi: "Tôi rất biết ơn!\nSự giúp đỡ của bạn rất có ý nghĩa!", ja: "とても感謝しています！\nあなたの助けはとても意味があります！" },
  { vi: "Chào mừng bạn đến!\nChúng tôi rất vui khi có bạn!", ja: "ようこそ！\nあなたが来てくれて嬉しいです！" },
  { vi: "Hôm nay tôi học được nhiều!\nCảm ơn mọi người đã chỉ dạy!", ja: "今日は多くを学びました！\n教えてくれた皆さん、ありがとう！" },
  { vi: "Cảm ơn vì đã giải thích!\nBây giờ tôi đã hiểu rõ hơn!", ja: "説明してくれてありがとう！\n今、よく理解できました！" },
  { vi: "Vâng, tôi nhớ rồi!\nTôi sẽ không quên điều này!", ja: "はい、覚えました！\nこれは忘れません！" },
  { vi: "Một ngày vui vẻ nhé!\nCùng nhau tạo bầu không khí tích cực!", ja: "良い一日を！\n一緒にポジティブな雰囲気を作りましょう！" },
  { vi: "Xin thất lễ khi làm phiền!\nCảm ơn vì đã lắng nghe!", ja: "お邪魔して失礼しました！\n聞いてくれてありがとう！" },
  { vi: "Chào, tôi là người mới!\nXin mọi người chỉ bảo thêm!", ja: "こんにちは、新人です！\n皆さん、いろいろ教えてください！" },
  { vi: "Vâng, tôi sẽ cẩn thận!\nCảm ơn vì đã nhắc nhở!", ja: "はい、気をつけます！\n注意してくれてありがとう！" },
  { vi: "Hôm nay tôi cũng sẽ cố!\nMỗi ngày một tiến bộ hơn!", ja: "今日も頑張ります！\n毎日一歩ずつ進歩します！" },
  { vi: "Cảm ơn, bạn cũng vậy!\nChúc bạn một ngày tốt lành!", ja: "ありがとう、あなたも！\n良い一日になりますように！" },
  { vi: "Tôi xin phép hỏi ạ!\nCó điều tôi chưa hiểu rõ!", ja: "質問させてください！\nよく分からないことがあります！" },
  { vi: "Xin hãy tiếp tục chỉ bảo tôi!\nTôi vẫn còn nhiều thứ cần học!", ja: "引き続き教えてください！\nまだまだ学ぶべきことがあります！" },
  { vi: "Cảm ơn vì sự chỉ dẫn!\nTôi sẽ áp dụng ngay vào công việc!", ja: "ご指導ありがとうございます！\nすぐに仕事に活かします！" },
  { vi: "Xin chào và cảm ơn!\nMọi người thật tuyệt vời!", ja: "こんにちは、そしてありがとう！\n皆さんは本当に素晴らしいです！" },

  // === 2. Đúng giờ (時間厳守) ===
  { vi: "Đúng giờ là tôn trọng nhau!\nHãy luôn đến đúng giờ quy định!", ja: "時間を守ることは互いを尊重することです！\n常に規定の時間通りに来ましょう！" },
  { vi: "Đến sớm hơn giờ làm việc!\nChuẩn bị kỹ trước khi bắt đầu!", ja: "始業時間より前に来ましょう！\n始める前にしっかり準備を！" },
  { vi: "Không bao giờ đi trễ!\nHãy lên kế hoạch để đến đúng giờ!", ja: "絶対に遅刻しない！\n時間通りに着くよう計画を立てましょう！" },
  { vi: "Báo cáo trước khi đến muộn!\nThông báo sớm để mọi người biết!", ja: "遅れる前に報告を！\n皆が分かるように早めに知らせましょう！" },
  { vi: "Thời gian là vàng bạc!\nĐừng để thời gian trôi qua vô ích!", ja: "時は金なり！\n時間を無駄に過ぎさせないで！" },
  { vi: "Chuẩn bị sẵn sàng trước giờ làm!\nSẵn sàng ngay từ đầu ngày!", ja: "仕事の前に準備万端に！\n一日の始まりから即座に動けるように！" },
  { vi: "Đúng giờ thể hiện trách nhiệm!\nNgười có trách nhiệm luôn đúng giờ!", ja: "時間を守ることは責任感の表れです！\n責任のある人は常に時間を守ります！" },
  { vi: "Nếu trễ, hãy báo ngay!\nĐừng để mọi người lo lắng!", ja: "もし遅れるなら、すぐに報告を！\n皆を心配させないで！" },
  { vi: "Không để mọi người chờ!\nThời gian của người khác cũng quý giá!", ja: "人を待たせない！\n他人の時間も貴重です！" },
  { vi: "Quản lý thời gian thật tốt!\nKế hoạch tốt giúp đúng giờ mọi lúc!", ja: "時間管理をしっかり！\n良い計画は常に時間を守る助けになります！" },
  { vi: "Đến làm việc đúng giờ!\nĐây là quy tắc cơ bản nhất!", ja: "時間通りに出勤する！\nこれが最も基本的なルールです！" },
  { vi: "Trễ giờ ảnh hưởng cả nhóm!\nMột người trễ, cả nhóm bị ảnh hưởng!", ja: "遅刻はチーム全体に影響します！\n一人の遅れが全員に響きます！" },
  { vi: "Hẹn giờ trước để không quên!\nCài báo thức ngay từ tối hôm trước!", ja: "忘れないようアラームを！\n前日の夜からアラームをセットしましょう！" },
  { vi: "Đúng giờ là nền tảng công việc!\nTất cả bắt đầu từ việc đúng giờ!", ja: "時間を守ることは仕事の基本です！\n全ては時間を守ることから始まります！" },
  { vi: "Luôn đến trước 5 phút!\nĐó là thói quen của người chuyên nghiệp!", ja: "常に5分前に到着する！\nそれがプロフェッショナルの習慣です！" },
  { vi: "Trân trọng thời gian của mọi người!\nĐúng giờ là cách thể hiện sự tôn trọng!", ja: "皆の時間を大切に！\n時間を守ることは敬意を示す方法です！" },
  { vi: "Báo cáo sớm khi có vấn đề!\nThông báo kịp thời giúp giải quyết nhanh hơn!", ja: "問題がある時は早めに報告を！\n早めの通知が迅速な解決に繋がります！" },
  { vi: "Không bao giờ trễ hẹn!\nUy tín được xây dựng qua từng lần đúng giờ!", ja: "約束に決して遅れない！\n信頼は毎回の時間厳守から築かれます！" },
  { vi: "Thời gian không thể lấy lại!\nMỗi phút qua đi là mất mãi mãi!", ja: "時間は取り戻せません！\n過ぎ去った一分は永遠に失われます！" },
  { vi: "Đúng giờ là thói quen tốt!\nRèn luyện mỗi ngày để thành thói quen!", ja: "時間を守るのは良い習慣です！\n習慣になるよう毎日鍛えましょう！" },
  { vi: "Sắp xếp lịch làm việc cẩn thận!\nKế hoạch rõ ràng giúp tránh trễ giờ!", ja: "仕事のスケジュールを丁寧に整える！\n明確な計画は遅刻を防ぎます！" },
  { vi: "Giờ giấc nghiêm túc hàng ngày!\nNhất quán trong việc đúng giờ!", ja: "毎日の時間を厳格に！\n時間を守ることにおいて一貫性を持ちましょう！" },
  { vi: "Không trễ, không vắng mặt!\nĐây là cam kết với công ty và đồng nghiệp!", ja: "遅刻せず、欠勤せず！\nこれは会社と同僚への約束です！" },
  { vi: "Đúng giờ giúp công việc suôn sẻ!\nMọi thứ diễn ra tốt hơn khi đúng giờ!", ja: "時間を守ると仕事がスムーズに！\n時間通りだと全てがより良く進みます！" },
  { vi: "Luôn thông báo khi có thay đổi!\nThay đổi lịch phải báo trước kịp thời!", ja: "変更がある時は常に知らせる！\nスケジュール変更は早めに報告すべきです！" },
  { vi: "Tôn trọng lịch làm việc!\nLịch trình là cam kết với tập thể!", ja: "勤務スケジュールを尊重する！\nスケジュールは集団への約束です！" },
  { vi: "Chuẩn bị kỹ để không bị trễ!\nPhòng bị trước luôn tốt hơn!", ja: "遅れないよう入念に準備する！\n事前の備えは常に良い結果を生みます！" },
  { vi: "Nếu về sớm, xin phép trước!\nĐừng tự ý rời đi khi chưa được phép!", ja: "早退する場合は、事前に許可を！\n許可なく勝手に立ち去らないで！" },
  { vi: "Giờ làm là giờ làm!\nTập trung vào công việc trong giờ làm!", ja: "勤務時間は勤務時間！\n勤務中は仕事に集中しましょう！" },
  { vi: "Kiểm tra lịch trình mỗi sáng!\nBắt đầu ngày mới với kế hoạch rõ ràng!", ja: "毎朝スケジュールを確認する！\n明確な計画で一日を始めましょう！" },
  { vi: "Đừng để công việc chồng chất!\nHoàn thành đúng hạn để tránh áp lực!", ja: "仕事を溜め込まないで！\nプレッシャーを避けるため期限通りに終わらせましょう！" },
  { vi: "Phân bổ thời gian hợp lý!\nMỗi công việc đều cần thời gian phù hợp!", ja: "時間を合理的に割り振る！\nそれぞれの仕事には適切な時間が必要です！" },
  { vi: "Hoàn thành việc đúng thời hạn!\nĐây là trách nhiệm với đồng nghiệp!", ja: "期限通りに仕事を完了させる！\nこれは同僚に対する責任です！" },
  { vi: "Ưu tiên công việc quan trọng!\nBiết việc nào cần làm trước, việc nào sau!", ja: "重要な仕事を優先する！\n先にやるべきこと、後にやるべきことを知りましょう！" },
  { vi: "Không lãng phí thời gian làm việc!\nMỗi giờ làm việc đều có giá trị!", ja: "勤務時間を無駄にしない！\n一時間一時間の労働に価値があります！" },
  { vi: "Báo cáo tiến độ đúng hạn!\nGiúp cả nhóm nắm bắt tình hình kịp thời!", ja: "進捗を期限通りに報告する！\nチーム全体が状況をタイムリーに把握する助けになります！" },
  { vi: "Giờ giải lao là giờ giải lao!\nNghỉ đúng giờ để làm việc hiệu quả hơn!", ja: "休憩時間は休憩時間！\nより効率的に働くため、時間通りに休みましょう！" },
  { vi: "Quay lại làm việc đúng giờ!\nKhông kéo dài thời gian nghỉ!", ja: "時間通りに仕事に戻る！\n休憩時間を延長しないように！" },
  { vi: "Không kéo dài giờ giải lao!\nTôn trọng quy định về thời gian nghỉ!", ja: "休憩を長引かせない！\n休憩時間に関する規定を尊重しましょう！" },
  { vi: "Đúng giờ mỗi ngày là thành công!\nThành công bắt đầu từ kỷ luật thời gian!", ja: "毎日の時間厳守が成功の元！\n成功は時間の規律から始まります！" },
  { vi: "Thông báo trước ít nhất 1 tiếng!\nĐể mọi người có thể sắp xếp kịp!", ja: "少なくとも1時間前には連絡を！\n皆が調整できるようにするためです！" },
  { vi: "Không tự ý rời chỗ làm!\nPhải báo cáo và được phép trước!", ja: "勝手に職場を離れない！\n事前に報告し許可を得る必要があります！" },
  { vi: "Nghiêm túc với giờ giấc!\nKỷ luật thời gian = kỷ luật bản thân!", ja: "時間に真剣になる！\n時間の規律＝自己の規律です！" },
  { vi: "Thời gian làm việc là tài sản!\nSử dụng hiệu quả mỗi phút làm việc!", ja: "勤務時間は資産です！\n働く一分一分を有効に使いましょう！" },
  { vi: "Đúng giờ xây dựng uy tín!\nNgười đúng giờ luôn được tin tưởng hơn!", ja: "時間を守ることは信頼を築きます！\n時間を守る人は常に、より信頼されます！" },
  { vi: "Không để đồng nghiệp chờ đợi!\nHãy nghĩ đến người khác khi trễ giờ!", ja: "同僚を待たせない！\n遅れる時は他人のことを考えましょう！" },
  { vi: "Hoàn thành công việc trước tan ca!\nĐừng để việc dở dang khi tan ca!", ja: "退勤前に仕事を終わらせる！\n退勤時に仕事をやり残さないで！" },
  { vi: "Lên kế hoạch để đúng thời hạn!\nKế hoạch tốt = kết quả đúng hạn!", ja: "期限を守るために計画を立てる！\n良い計画＝期限通りの結果！" },
  { vi: "Mỗi phút đều có giá trị!\nSử dụng thời gian một cách có ý nghĩa!", ja: "一分一分に価値があります！\n有意義に時間を使いましょう！" },
  { vi: "Đúng giờ là tôn trọng bản thân!\nNgười kỷ luật với bản thân sẽ thành công!", ja: "時間を守ることは自分を尊重することです！\n自己規律のある人は成功します！" },

  // === 3. Quy tắc an toàn (安全ルール) ===
  { vi: "Đội mũ bảo hiểm bắt buộc!\nAn toàn của bạn là quan trọng nhất!", ja: "ヘルメット着用は義務です！\nあなたの安全が最も重要です！" },
  { vi: "Đeo găng tay bảo hộ!\nBảo vệ đôi tay - công cụ làm việc của bạn!", ja: "保護手袋を着用しましょう！\nあなたの仕事道具である手を守りましょう！" },
  { vi: "An toàn là trên hết!\nKhông có công việc nào quan trọng hơn an toàn!", ja: "安全第一！\n安全より重要な仕事はありません！" },
  { vi: "Không bỏ qua quy trình an toàn!\nQuy trình an toàn là để bảo vệ bạn!", ja: "安全手順を飛ばさない！\n安全手順はあなたを守るためのものです！" },
  { vi: "Đọc kỹ hướng dẫn trước khi làm!\nHiểu rõ trước khi bắt tay vào việc!", ja: "作業前に説明書をよく読む！\n取りかかる前にしっかり理解しましょう！" },
  { vi: "Mặc đồ bảo hộ đầy đủ!\nTrang bị đúng cách trước khi làm việc!", ja: "保護具を完全に着用する！\n作業前に正しく装備しましょう！" },
  { vi: "Báo cáo ngay khi phát hiện nguy hiểm!\nMột báo cáo kịp thời có thể cứu nhiều người!", ja: "危険を見つけたらすぐに報告を！\nタイムリーな報告が多くの人を救うことがあります！" },
  { vi: "Không tự ý sửa máy móc!\nHãy để người có chuyên môn xử lý!", ja: "勝手に機械を修理しない！\n専門家に任せましょう！" },
  { vi: "Luôn kiểm tra máy trước khi dùng!\nKiểm tra trước - an toàn sau!", ja: "使う前に必ず機械を点検する！\nまず点検、次に安全！" },
  { vi: "Giữ khu vực làm việc an toàn!\nMôi trường an toàn = làm việc hiệu quả!", ja: "作業エリアの安全を保つ！\n安全な環境＝効率的な仕事！" },
  { vi: "Không chạy trong khu vực sản xuất!\nĐi bộ cẩn thận để tránh tai nạn!", ja: "製造エリア内で走らない！\n事故を防ぐため慎重に歩きましょう！" },
  { vi: "Sử dụng đúng công cụ cho công việc!\nCông cụ sai có thể gây nguy hiểm!", ja: "仕事に合った正しい道具を使う！\n間違った道具は危険を招くことがあります！" },

  { vi: "Không bỏ qua tín hiệu cảnh báo!\nTín hiệu cảnh báo là để bảo vệ bạn!", ja: "警告信号を無視しない！\n警告信号はあなたを守るためのものです！" },
  { vi: "Kiểm tra thiết bị bảo hộ hàng ngày!\nThiết bị hỏng không thể bảo vệ bạn!", ja: "保護具を毎日チェックする！\n壊れた装備はあなたを守れません！" },
  { vi: "An toàn cho mình, an toàn cho mọi người!\nMột người không an toàn ảnh hưởng cả nhóm!", ja: "自分の安全、皆の安全！\n一人の不安全がグループ全体に影響します！" },
  { vi: "Không làm việc một mình ở nơi nguy hiểm!\nHãy có người giám sát khi cần thiết!", ja: "危険な場所で一人で作業しない！\n必要な時は監督者をつけましょう！" },
  { vi: "Biết vị trí cầu dao điện khẩn cấp!\nChuẩn bị sẵn sàng cho tình huống khẩn cấp!", ja: "非常用ブレーカーの位置を知っておく！\n緊急事態に備えましょう！" },
  { vi: "Không để dây điện lộn xộn!\nDây điện lộn xộn có thể gây tai nạn!", ja: "電線を散らかしたままにしない！\n乱れた電線は事故の原因になります！" },
  { vi: "Tắt máy khi không sử dụng!\nTiết kiệm điện và tránh tai nạn!", ja: "使わない時は機械を切る！\n節電と事故防止になります！" },
  { vi: "Không che khuất lối thoát hiểm!\nLối thoát hiểm phải luôn thông thoáng!", ja: "避難経路を塞がない！\n避難経路は常に通りやすくしておかなければなりません！" },
  { vi: "Biết cách dùng bình chữa cháy!\nHọc cách sử dụng khi chưa cần dùng đến!", ja: "消火器の使い方を知っておく！\n必要になる前に使い方を学びましょう！" },
  { vi: "Báo cáo tai nạn dù nhỏ!\nTai nạn nhỏ có thể là dấu hiệu của vấn đề lớn!", ja: "小さな事故でも報告する！\n小さな事故は大きな問題の兆候かもしれません！" },
  { vi: "Đi đúng đường trong nhà máy!\nĐường đi an toàn được quy định rõ ràng!", ja: "工場内の正しい道を通る！\n安全な通路は明確に定められています！" },
  { vi: "Không mang thức ăn vào khu sản xuất!\nVệ sinh sản xuất là yêu cầu bắt buộc!", ja: "製造エリアに食べ物を持ち込まない！\n製造衛生は必須条件です！" },
  { vi: "Rửa tay sau khi tiếp xúc hóa chất!\nBảo vệ sức khỏe bắt đầu từ vệ sinh!", ja: "化学物質に触れた後は手を洗う！\n健康を守ることは衛生から始まります！" },
  { vi: "Không hút thuốc trong khu vực cấm!\nTôn trọng quy định để bảo vệ mọi người!", ja: "禁煙エリアで喫煙しない！\n皆を守るためにルールを尊重しましょう！" },
  { vi: "Kiểm tra xung quanh trước khi hành động!\nNhìn trước, hành động sau!", ja: "行動する前に周りを確認する！\n前を見てから行動しましょう！" },
  { vi: "An toàn không phải lựa chọn!\nAn toàn là yêu cầu bắt buộc!", ja: "安全は選択肢ではありません！\n安全は必須条件です！" },
  { vi: "Mang kính bảo hộ khi cần thiết!\nBảo vệ đôi mắt - không thể thay thế!", ja: "必要な時は保護メガネをかける！\n代わりのきかない目を守りましょう！" },
  { vi: "Không làm việc khi mệt mỏi quá độ!\nMệt mỏi làm tăng nguy cơ tai nạn!", ja: "過度に疲れている時は作業しない！\n疲労は事故のリスクを高めます！" },
  { vi: "Báo cáo thiết bị hỏng ngay lập tức!\nThiết bị hỏng cần được sửa chữa ngay!", ja: "故障した設備はすぐに報告する！\n故障設備はすぐに修理が必要です！" },
  { vi: "Theo dõi đồng nghiệp xung quanh!\nChúng ta cùng chịu trách nhiệm về an toàn!", ja: "周りの同僚を見守る！\n私たちは共に安全に責任を持っています！" },
  { vi: "Không bỏ hóa chất bừa bãi!\nHóa chất cần được xử lý đúng cách!", ja: "化学物質を適当に放置しない！\n化学物質は正しく処理される必要があります！" },
  { vi: "Giữ bình tĩnh khi xảy ra sự cố!\nBình tĩnh giúp xử lý tình huống tốt hơn!", ja: "トラブルが起きた時は冷静に！\n冷静さが状況をより良く処理する助けになります！" },
  { vi: "Biết quy trình xử lý khẩn cấp!\nChuẩn bị kỹ để ứng phó kịp thời!", ja: "緊急対応手順を知っておく！\n迅速に対応できるようしっかり準備しましょう！" },
  { vi: "Không dùng điện thoại khi vận hành máy!\nTập trung hoàn toàn khi vận hành máy!", ja: "機械の操作中に電話を使わない！\n操作中は完全に集中しましょう！" },
  { vi: "Luôn có người giám sát khi làm nguy hiểm!\nAn toàn cần được giám sát chặt chẽ!", ja: "危険な作業には常に監視者をつける！\n安全は厳重に監視される必要があります！" },
  { vi: "An toàn là trách nhiệm của mọi người!\nMỗi người đều có vai trò giữ an toàn!", ja: "安全は全員の責任です！\n一人一人が安全を守る役割を持っています！" },
  { vi: "Không leo trèo lên nơi nguy hiểm!\nSử dụng thang đúng cách và đúng quy định!", ja: "危険な場所に登らない！\nはしごを正しく、規定通りに使いましょう！" },
  { vi: "Bảo quản công cụ cẩn thận!\nCông cụ tốt giúp làm việc an toàn hơn!", ja: "道具を丁寧に保管する！\n良い道具はより安全な作業を助けます！" },
  { vi: "Học và nhớ các ký hiệu an toàn!\nKý hiệu an toàn là ngôn ngữ phổ quát!", ja: "安全標識を学び覚える！\n安全標識は世界共通の言語です！" },
  { vi: "Kiểm tra lại sau khi làm xong!\nXác nhận mọi thứ an toàn trước khi rời đi!", ja: "終わった後に再確認する！\n立ち去る前に全てが安全であることを確認しましょう！" },
  { vi: "Báo cáo điều kiện không an toàn!\nMột báo cáo có thể ngăn chặn tai nạn!", ja: "不安全な状態を報告する！\n一つの報告が事故を防ぐことができます！" },
  { vi: "Không tiếp xúc hóa chất khi không có bảo hộ!\nBảo hộ là bảo vệ sức khỏe lâu dài!", ja: "保護具なしで化学物質に触れない！\n保護は長期的な健康を守ることです！" },
  { vi: "An toàn lao động = cuộc sống hạnh phúc!\nVề nhà an toàn mỗi ngày là điều quan trọng nhất!", ja: "労働安全＝幸せな生活！\n毎日安全に家に帰ることが最も重要です！" },
  { vi: "Không vứt rác ra sàn!\nSàn sạch sẽ giúp ngăn ngừa tai nạn trượt ngã!", ja: "床にゴミを捨てない！\nきれいな床は転倒事故を防ぎます！" },
  { vi: "Tuân thủ an toàn là bảo vệ bản thân!\nQuy tắc an toàn không phải là gánh nặng!", ja: "安全を遵守することは自分を守ることです！\n安全ルールは負担ではありません！" },
  { vi: "Phòng ngừa tai nạn từ đầu!\nTốt hơn là phải xử lý hậu quả sau này!", ja: "最初から事故を防ぐ！\n後で結果を処理するよりも良いです！" },

  { vi: "Không hút thuốc trong khu vực làm việc!\nTôn trọng sức khỏe của mọi người!", ja: "会社の備品を大切にする！\n会社の資産は皆の資産です！" },

// ================================================================
// 言語
// ================================================================
let currentLang = 'vi';

const STRINGS = {
  ja: {
    swipeHint:    '← スワイプして次の鞘へ →',
    clearedTitle: '全クリア！',
    clearedSub:   '全部の枝豆がとびだした！',
    retryBtn:     'もう一度',
  },
  vi: {
    swipeHint:    '← Vuốt sang vỏ tiếp theo →',
    clearedTitle: 'Hoàn thành!',
    clearedSub:   'Tất cả đậu đã bay ra!',
    retryBtn:     'Chơi lại',
  }
};

function setLang(lang) {
  currentLang = lang;
  document.getElementById('btn-ja').classList.toggle('active', lang === 'ja');
  document.getElementById('btn-vi').classList.toggle('active', lang === 'vi');
  document.getElementById('swipe-hint').textContent = STRINGS[lang].swipeHint;
  document.querySelector('#cleared .cl-title').textContent = STRINGS[lang].clearedTitle;
  document.querySelector('#cleared .cl-sub').textContent   = STRINGS[lang].clearedSub;
  document.getElementById('retry-btn').textContent = STRINGS[lang].retryBtn;
  document.title = lang === 'ja' ? '枝豆ゲーム' : 'Trò Chơi Đậu';
  updateCounter();
}

// ================================================================
// ゲーム状態
// ================================================================
const TOTAL_PODS   = 5;
const POD_SIZE     = 3;
let podsDone       = 0;
let currentPodSize = POD_SIZE;
let beanItems      = [];
let beansFlown     = 0;
let gamePhase      = 'idle';
let pressTimer     = null;
let totalClears    = 0;
let faceInterval   = null;

// ================================================================
// 初期化
// ================================================================
function resetGame() {
  clearFaceInterval();
  document.getElementById('cleared').classList.remove('show');
  podsDone = 0;
  loadPod(true);
}

function loadPod(isFirst) {
  gamePhase     = 'idle';
  beansFlown    = 0;
  beanItems     = [];
  currentPodSize = POD_SIZE;
  renderScene();
  updateCounter();

  if (!isFirst) {
    const area = document.getElementById('pod-area');
    area.classList.add('in-right');
    area.addEventListener('animationend', () => area.classList.remove('in-right'), { once:true });
  }
}

// ================================================================
// シーン描画
// ================================================================
function renderScene() {
  const vw    = window.innerWidth;
  const podW  = Math.min(400, Math.floor(vw * 0.92));
  const beanSz = Math.min(91, Math.floor(vw * 0.175));

  document.getElementById('pod-img').style.width = podW + 'px';

  const podWrap = document.getElementById('pod-wrap');
  podWrap.ontouchstart = onPodTouchStart;
  podWrap.onmousedown  = onPodMouseDown;

  const rowEl = document.getElementById('beans-row');
  rowEl.innerHTML = '';

  const shuffled = [...Array(FACE_FILES.length).keys()].sort(() => Math.random() - 0.5);

  for (let i = 0; i < POD_SIZE; i++) {
    const item = makeBeanChar(beanSz, shuffled[i % shuffled.length], i);
    rowEl.appendChild(item.el);
    beanItems.push(item);
  }

  document.getElementById('swipe-hint').classList.remove('show');
}

// ================================================================
// 豆キャラ生成
// ================================================================
function makeBeanChar(size, faceIdx, beanIndex) {
  const wrap = document.createElement('div');
  wrap.className = 'bean-char';
  const hideY = size + 20;
  // 左・真ん中・右で縦位置オフセット（20% / 10% / 0 of bean size）
  const Y_OFFSETS = [size * 0.2, size * 0.1, 0];
  const offsetY = Y_OFFSETS[beanIndex] ?? 0;
  wrap.style.cssText = `opacity:0; transform:translateY(${hideY}px) scale(0.3); pointer-events:none; top:${offsetY}px;`;

  const bubble = document.createElement('div');
  bubble.className = 'speech-bubble';
  bubble.style.setProperty('writing-mode', 'horizontal-tb', 'important');
  bubble.style.setProperty('-webkit-writing-mode', 'horizontal-tb', 'important');
  bubble.style.setProperty('text-orientation', 'mixed', 'important');
  if (POD_SIZE > 1) {
    if (beanIndex === 0) bubble.classList.add('to-right');
    else if (beanIndex === POD_SIZE - 1) bubble.classList.add('to-left');
  }

  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size * 6;
  canvas.style.cssText = `width:${size}px; height:${size}px;`;
  canvas.dataset.fi = faceIdx;
  drawFaceOnCanvas(canvas, faceIdx);

  wrap.appendChild(bubble);
  wrap.appendChild(canvas);

  const fly = (e) => { e?.preventDefault(); e?.stopPropagation(); tapBean(wrap, beanIndex); };
  wrap.addEventListener('touchend', fly, { passive:false });
  wrap.addEventListener('click', fly);

  return { el:wrap, revealed:false, flown:false };
}

// ================================================================
// 鞘のタッチ処理
// ================================================================
function getTouchedZone(clientX) {
  const podRect = document.getElementById('pod-wrap').getBoundingClientRect();
  const relX = (clientX - podRect.left) / podRect.width;
  const clamped = Math.max(0, Math.min(0.9999, relX));
  return Math.floor(clamped * POD_SIZE);
}

function onPodTouchStart(e) {
  e.preventDefault();
  initAudio();
  const t = e.touches[0];
  const sx = t.clientX, sy = t.clientY;

  if (gamePhase === 'swipeable') {
    document.ontouchend = (ev) => {
      document.ontouchend = null;
      const tt = ev.changedTouches[0];
      const dx = tt.clientX - sx, dy = tt.clientY - sy;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) launchPod(dx > 0 ? 'right' : 'left');
    };
    return;
  }
  // iOS: speechSynthesis.speak() はジェスチャーハンドラ内で直接呼ぶ必要がある
  // setTimeout 内から呼ぶと iOS Safari/Chrome で無視される
  if (gamePhase === 'idle') {
    pendingSpeech = SPEECHES[Math.floor(Math.random() * SPEECHES.length)];
    speakJapanese(pendingSpeech.ja);
  }
  const zone = getTouchedZone(sx);
  beginPress(zone);
  document.ontouchend = () => { endPress(); document.ontouchend = null; };
}

function onPodMouseDown(e) {
  initAudio();
  const sx = e.clientX;
  if (gamePhase === 'swipeable') {
    document.onmouseup = (ev) => {
      document.onmouseup = null;
      const dx = ev.clientX - sx;
      if (Math.abs(dx) > 50) launchPod(dx > 0 ? 'right' : 'left');
    };
    return;
  }
  if (gamePhase === 'idle') {
    pendingSpeech = SPEECHES[Math.floor(Math.random() * SPEECHES.length)];
    speakJapanese(pendingSpeech.ja);
  }
  const zone = getTouchedZone(sx);
  beginPress(zone);
  document.onmouseup = () => { endPress(); document.onmouseup = null; };
}

function beginPress(zone) {
  if (gamePhase !== 'idle') return;
  const item = beanItems[zone];
  if (!item || item.revealed || item.flown) return;
  sfxMunyu();
  const ring = document.getElementById('press-ring');
  ring.classList.remove('running');
  void ring.offsetWidth;
  ring.classList.add('running');
  pressTimer = setTimeout(() => peekBeanAtIndex(zone), 600);
}

function endPress() {
  clearTimeout(pressTimer);
  document.getElementById('press-ring').classList.remove('running');
}

// ================================================================
// 豆を1個だけひょっこり出す
// ================================================================
function peekBeanAtIndex(index) {
  if (gamePhase !== 'idle') return;
  const item = beanItems[index];
  if (!item || item.revealed || item.flown) return;

  gamePhase = 'showing';
  item.revealed = true;
  document.getElementById('press-ring').classList.remove('running');

  const pw = document.getElementById('pod-wrap');
  pw.classList.add('pod-shake');
  setTimeout(() => pw.classList.remove('pod-shake'), 400);

  sfxPunyu();

  const { el } = item;
  el.style.transition = 'transform 0.46s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s ease';
  el.style.opacity    = '1';
  el.style.transform  = 'translateY(0) scale(1)';
  el.style.pointerEvents = 'auto';

  const bubble = el.querySelector('.speech-bubble');
  bubble.style.setProperty('writing-mode', 'horizontal-tb', 'important');
  bubble.style.setProperty('-webkit-writing-mode', 'horizontal-tb', 'important');
  // ジェスチャーハンドラ内で事前選択・読み上げ済みのセリフを使う
  const speech = pendingSpeech ?? SPEECHES[Math.floor(Math.random() * SPEECHES.length)];
  pendingSpeech = null;
  bubble.innerHTML = formatSpeech(currentLang === 'ja' ? speech.ja : speech.vi);
  // speakJapanese はタッチ/クリックハンドラ内で既に呼び済み（iOS対応）
  setTimeout(() => {
    bubble.classList.add('show');
    setTimeout(() => bubble.classList.remove('show'), 8064);
  }, 150);
}

// ================================================================
// 豆をタップ → 上方向に飛んでいく
// ================================================================
function tapBean(el, beanIndex) {
  if (gamePhase !== 'showing') return;
  const item = beanItems[beanIndex];
  if (!item || item.flown) return;
  item.flown = true;
  item.revealed = false;
  el.style.pointerEvents = 'none';

  gamePhase = 'flying';

  const bubble = el.querySelector('.speech-bubble');
  bubble.classList.remove('show');

  sfxPyun();

  const spread   = Math.random() * 120 - 60;
  const angleDeg = -90 + spread;
  const rad      = angleDeg * Math.PI / 180;
  const dist     = 700 + Math.random() * 300;
  const fx       = Math.cos(rad) * dist;
  const fy       = Math.sin(rad) * dist;
  const fr       = (Math.random() < 0.5 ? 1 : -1) * (Math.random() * 540 + 270);

  el.style.transition = 'none';
  el.style.setProperty('--fx', fx + 'px');
  el.style.setProperty('--fy', fy + 'px');
  el.style.setProperty('--fr', fr + 'deg');
  el.style.animation = 'fly-out 0.7s cubic-bezier(0.25,0.46,0.45,0.94) forwards';

  setTimeout(() => {
    el.style.visibility = 'hidden';
    beansFlown++;
    updateCounter();

    if (beansFlown >= currentPodSize) {
      onAllBeansGone();
    } else {
      gamePhase = 'idle';
    }
  }, 700);
}

function onAllBeansGone() {
  gamePhase = 'swipeable';
  document.getElementById('swipe-hint').textContent = STRINGS[currentLang].swipeHint;
  setTimeout(() => document.getElementById('swipe-hint').classList.add('show'), 300);
}

// ================================================================
// 鞘スワイプ → 次へ
// ================================================================
function launchPod(dir) {
  if (gamePhase !== 'swipeable') return;
  gamePhase = 'transitioning';
  sfxShu();
  document.getElementById('swipe-hint').classList.remove('show');

  const area = document.getElementById('pod-area');
  area.classList.add(dir === 'right' ? 'out-right' : 'out-left');

  area.addEventListener('animationend', () => {
    area.className = '';
    podsDone++;

    if (podsDone >= TOTAL_PODS) {
      sfxFanfare();
      totalClears++;
      showClearScreen();
      return;
    }

    loadPod(false);

    requestAnimationFrame(() => {
      area.classList.add(dir === 'right' ? 'in-left' : 'in-right');
      area.addEventListener('animationend', () => { area.className = ''; }, { once:true });
    });
  }, { once:true });
}

// ================================================================
// クリア画面表示
// ================================================================
function showClearScreen() {
  const img = document.getElementById('cl-icon-img');

  if (totalClears % 3 === 0) {
    clearFaceInterval();
    img.src = 'clear.png';
    img.style.borderRadius = '0';
    img.style.boxShadow = 'none';
  } else {
    img.style.borderRadius = '50%';
    img.style.boxShadow = '0 4px 20px rgba(0,0,0,0.15)';
    const faces = FACE_FILES.map(f => f.split('?')[0]);
    let idx = Math.floor(Math.random() * faces.length);
    img.src = faces[idx];
    faceInterval = setInterval(() => {
      idx = (idx + 1 + Math.floor(Math.random() * (faces.length - 1))) % faces.length;
      img.src = faces[idx];
    }, 150);
  }

  setTimeout(() => document.getElementById('cleared').classList.add('show'), 200);
}

function clearFaceInterval() {
  if (faceInterval) { clearInterval(faceInterval); faceInterval = null; }
}

// ================================================================
// カウンター
// ================================================================
function updateCounter() {
  document.getElementById('counter').innerHTML =
    `<img src="saya.PNG" class="counter-img"> ${podsDone+1} / ${TOTAL_PODS}<br><img src="mame1.png" class="counter-img counter-img-mame"> ${currentPodSize - beansFlown}`;
}

// ================================================================
// スタート
// ================================================================
document.addEventListener('touchstart', initAudio, { once:true });
document.addEventListener('mousedown',  initAudio, { once:true });

resetGame();
</script>
